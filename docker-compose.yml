# ai学 一键部署
version: "3.8"

services:
  backend:
    build: ./backend
    container_name: ailearn-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - AILEARN_HOST=0.0.0.0
      - AILEARN_PORT=8000
      - AILEARN_DEBUG=false
      - AILEARN_CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
